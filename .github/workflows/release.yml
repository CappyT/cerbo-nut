name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: resolve version
        run: |
          V="${GITHUB_REF_NAME}"
          echo "$V" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "'$V' is not a valid semver tag (vX.Y.Z)"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build binaries
        run: |
          mkdir -p dist
          build() {
            GOOS="$1" GOARCH="$2" GOARM="$3" CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X main.version=${VERSION}" \
                -o "dist/cerbo-nut-${VERSION}-$4" .
          }
          build linux arm   7  linux-armv7
          build linux arm64 "" linux-arm64
          build linux amd64 "" linux-amd64

      - name: checksums
        run: cd dist && sha256sum * > checksums.txt

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: dist/*
          generate_release_notes: true
